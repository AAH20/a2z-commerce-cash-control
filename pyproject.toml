[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2z-commerce-cash-control"
version = "0.3.0"
description = "Read-only commerce order, processor payout, and ledger reconciliation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cash-control = "cash_control.cli:main"
closeops = "cash_control.closeops:main"
stripe-bridge = "cash_control.stripe_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
