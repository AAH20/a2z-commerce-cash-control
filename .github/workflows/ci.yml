name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: cash-control examples/manifest.json --output-dir /tmp/cash-control-demo
      - run: python -c 'import json; d=json.load(open("/tmp/cash-control-demo/report.json")); assert d["ledger_linked_payout_by_currency"] == {"USD":"145.00"} and d["exception_counts"] == {"missing_processor_charge":1}'
